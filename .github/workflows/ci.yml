name: CI / Pre-Deployment Smoke & Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-smoke-test:
    name: 🛡️ Audit, Taxonomy, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚡ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Strict Typecheck (GR-03)
        run: npm run typecheck

      - name: 🗂️ Validate Mallorca Services Taxonomy Integrity
        run: npm run validate:taxonomy

      - name: 🧪 Execute Unit & Integration Test Suites (GR-05)
        run: npm test

      - name: 🛡️ Execute Multi-Auditor Intelligence Audit (5 Specialized Auditors)
        run: npm run audit:full

      - name: 🏗️ Execute Production Build Smoke Test (GR-10)
        run: npm run build

      - name: 🚀 Deploy to Cloudflare Workers (Auto-Deploy on Main Push)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'dbd535725cc4f3bc69288909ae46b920' }}
          command: deploy
