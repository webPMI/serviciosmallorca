<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="grad-bg-steak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0f0a"/>
      <stop offset="50%" stop-color="#2d150e"/>
      <stop offset="100%" stop-color="#421f15"/>
    </linearGradient>
    <linearGradient id="fire-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5a93c"/>
      <stop offset="100%" stop-color="#ff5722"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#grad-bg-steak)"/>

  <!-- Geometric & Grill Glow Elements -->
  <circle cx="1080" cy="160" r="240" fill="#e5a93c" opacity="0.08"/>
  <circle cx="150" cy="540" r="200" fill="#ff5722" opacity="0.12"/>
  <path d="M0,540 Q350,480 700,530 T1200,510 L1200,675 L0,675 Z" fill="#0a0503" opacity="0.5"/>

  <!-- Main Card Graphic -->
  <g transform="translate(600, 290)" filter="url(#shadow)" text-anchor="middle">
    <!-- Icon Circle -->
    <circle cx="0" cy="-60" r="65" fill="url(#fire-grad)" opacity="0.95"/>
    <text x="0" y="-42" font-size="50" text-anchor="middle">🥩</text>

    <!-- Business Title -->
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="1">
      La Hacienda Steak House
    </text>

    <!-- Subtitle / Location -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="url(#fire-grad)" letter-spacing="2">
      PEGUERA (CALVIÀ), MALLORCA
    </text>

    <!-- Tags / Highlights -->
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#e0e0e0" opacity="0.9">
      Carnes a la Brasa de Carbón · Chuletón Madurado · Buffet de Ensaladas Incluido
    </text>
  </g>

  <!-- Verified Badge -->
  <g transform="translate(80, 80)">
    <rect width="190" height="42" rx="21" fill="rgba(229, 169, 60, 0.18)" stroke="#e5a93c" stroke-width="1.5"/>
    <text x="95" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffcc80" text-anchor="middle">
      🛡️ VERIFICADO 92%
    </text>
  </g>

  <!-- Brand Watermark -->
  <text x="1120" y="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" opacity="0.4" text-anchor="end">
    SERVICIOS MALLORCA
  </text>
</svg>
