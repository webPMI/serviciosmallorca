<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="stay-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#172a45"/>
      <stop offset="100%" stop-color="#203a43"/>
    </linearGradient>
    <linearGradient id="gold-stay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f8e71c"/>
    </linearGradient>
    <filter id="shadow-stay" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#stay-bg)"/>

  <!-- Harbor Lines & Geometric Elements -->
  <circle cx="1080" cy="150" r="230" fill="#d4af37" opacity="0.07"/>
  <circle cx="120" cy="560" r="190" fill="#203a43" opacity="0.3"/>
  <path d="M0,520 Q350,470 700,510 T1200,490 L1200,675 L0,675 Z" fill="#060e18" opacity="0.5"/>

  <!-- Main Content Graphic -->
  <g transform="translate(600, 290)" filter="url(#shadow-stay)" text-anchor="middle">
    <!-- Icon Circle -->
    <circle cx="0" cy="-60" r="65" fill="url(#gold-stay)" opacity="0.95"/>
    <text x="0" y="-42" font-size="50" text-anchor="middle">🦞</text>

    <!-- Business Title -->
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="1">
      Restaurante Stay
    </text>

    <!-- Subtitle / Location -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="url(#gold-stay)" letter-spacing="2">
      MOLL NOU · PORT DE POLLENÇA (DESDE 1972)
    </text>

    <!-- Tags / Highlights -->
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#e0e0e0" opacity="0.9">
      Caldereta de Langosta · Pescado Salvaje · Abierto 365 Días · Vistas a la Bahía
    </text>
  </g>

  <!-- Verified Badge -->
  <g transform="translate(80, 80)">
    <rect width="190" height="42" rx="21" fill="rgba(212, 175, 55, 0.18)" stroke="#d4af37" stroke-width="1.5"/>
    <text x="95" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8e71c" text-anchor="middle">
      🛡️ VERIFICADO 97%
    </text>
  </g>

  <!-- Brand Watermark -->
  <text x="1120" y="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" opacity="0.4" text-anchor="end">
    SERVICIOS MALLORCA
  </text>
</svg>
