<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="50%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="50%" stop-color="#fecdd3"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="225" r="220" fill="url(#glow)"/>
  <g transform="translate(400, 205)" text-anchor="middle">
    <text font-size="88" y="0">🎨</text>
    <text y="70" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="url(#gold)" letter-spacing="4">ARTE, TATUAJES &amp; ESTUDIOS</text>
    <text y="98" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#fecdd3" letter-spacing="2">SERVICIOS MALLORCA</text>
  </g>
</svg>
