    <text y="70" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="url(#gold)" letter-spacing="4">NÁUTICA &amp; CHARTER DE LUJO</text>
    <text y="98" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#bae6fd" letter-spacing="2">SERVICIOS MALLORCA</text>
