<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="225" r="220" fill="url(#glow)"/>
  <g transform="translate(400, 205)" text-anchor="middle">
    <text font-size="88" y="0">⚖️</text>
    <text y="70" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="url(#gold)" letter-spacing="4">SERVICIOS PROFESIONALES &amp; LEGAL</text>
    <text y="98" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#bfdbfe" letter-spacing="2">SERVICIOS MALLORCA</text>
  </g>
</svg>
