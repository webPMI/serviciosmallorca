    <text y="70" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="url(#gold)" letter-spacing="4">SERVICIOS MALLORCA</text>
    <text y="98" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#a1a1aa" letter-spacing="2">GUÍA OFICIAL DE NEGOCIOS VERIFICADOS</text>
  </g>
